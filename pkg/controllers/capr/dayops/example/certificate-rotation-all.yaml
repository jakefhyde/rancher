          command: 'rm -rf /var/lib/rancher/rke2/server/manifests-*.yaml'
        - name: 'Restart service'
          command: 'systemctl restart rke2-server.service'
    - selector:
        matchExpressions:
          - key: agent.cattle.io/etcd-role
            operator: NotIn
            values: [ "true" ]
          - key: agent.cattle.io/controlplane-role
            operator: NotIn
            values: [ "true" ]
          - key: agent.cattle.io/worker-role
            operator: In
            values: [ "true" ]
          - key: agent.cattle.io/os
            operator: NotIn
            values: [ "windows" ]
      commands:
        - name: 'Restart service'
          command: 'systemctl restart rke2-agent.service'
