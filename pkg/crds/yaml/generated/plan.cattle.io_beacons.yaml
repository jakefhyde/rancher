---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.1
  name: beacons.plan.cattle.io
spec:
  group: plan.cattle.io
  names:
    kind: Beacon
    listKind: BeaconList
    plural: beacons
    shortNames:
    - bcn
    singular: beacon
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.holder.operation
      name: Operation
      type: string
    - jsonPath: .status.holder.name.name
      name: Holder
      type: string
    - jsonPath: .status.holder.acquiredAt
      name: Acquired
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Beacon is the per-cluster lock used to serialise day-2 operations and the
          signal system-agents listen on to know when to participate.

          One Beacon exists per cluster, named after the cluster, in the same
          namespace as that cluster's ClusterPlans.

          Acquisition follows a single-slot mailbox pattern: the trigger controller
          writes Spec.Acquisition; the beacon controller reads it, decides accept
          or reject (or pre-empt for cancelsOthers requests), and clears the slot.

          While held, Status.Active is true and Status.ActiveSelectors enumerates
          the node label selectors of every NodePoolPlan that the holder ClusterPlan
          will (or did) create work for. System-agents on each node continuously
          watch their cluster's Beacon: when ActiveSelectors changes such that any
          selector matches the agent's labels, the agent calls the registration
          endpoint (see Status.RegistrationEndpoint) and receives a JSON payload
          containing its NodePlan name and a kubeconfig narrowly scoped to watch
          that NodePlan. Workers stay idle (no NodePlan, no kubeconfig, no RBAC)
          during operations whose selectors do not match them — the etcd-snapshot
          case where workers do nothing is the motivating example.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BeaconSpec is the desired state of a Beacon.
            properties:
              acquisition:
                description: |-
                  Acquisition is the single-slot mailbox: the trigger controller
                  writes a request here when a new ClusterPlan needs the Beacon.
                  The beacon controller clears this field once the request has been
                  accepted (Free → Acquired or Acquired → Cancelling) or rejected.
                properties:
                  clusterPlan:
                    description: ClusterPlan references the requesting plan in the
                      Beacon's namespace.
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  lifecycle:
                    description: |-
                      Lifecycle copied from the requesting plan so the beacon controller
                      can decide accept vs pre-empt without fetching the ClusterPlan.
                    properties:
                      cancellable:
                        default: false
                        description: |-
                          Cancellable=true means an incoming operation marked CancelsOthers may
                          pre-empt this one while it holds the Beacon.
                        type: boolean
                      cancelsOthers:
                        default: false
                        description: |-
                          CancelsOthers=true means rendering this operation may pre-empt a
                          Cancellable holder of the Beacon.
                        type: boolean
                      timeoutSeconds:
                        default: 3600
                        description: |-
                          TimeoutSeconds is the maximum wall-clock time the operation may hold
                          the Beacon. If exceeded, the framework forcibly clears the Beacon and
                          marks the operation Failed.
                        format: int32
                        minimum: 60
                        type: integer
                    type: object
                  operation:
                    description: |-
                      Operation is the requesting plan's operation name (e.g.
                      "etcd-snapshot-restore").
                    minLength: 1
                    type: string
                  requestedAt:
                    description: RequestedAt is when the trigger controller wrote
                      the request.
                    format: date-time
                    type: string
                  uid:
                    description: |-
                      UID of the requesting ClusterPlan, used to disambiguate against a
                      stale request after delete-and-recreate.
                    type: string
                required:
                - clusterPlan
                - lifecycle
                - operation
                - requestedAt
                - uid
                type: object
              clusterRef:
                description: |-
                  ClusterRef identifies the cluster this Beacon serialises operations
                  for.
                properties:
                  apiVersion:
                    description: APIVersion of the cluster object.
                    minLength: 1
                    type: string
                  kind:
                    description: Kind of the cluster object (e.g. "Cluster").
                    minLength: 1
                    type: string
                  name:
                    description: Name of the cluster object.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the cluster object. Empty for cluster-scoped clusters
                      (the imported management.cattle.io/v3.Cluster case).
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
            required:
            - clusterRef
            type: object
          status:
            description: BeaconStatus is the observed state of a Beacon.
            properties:
              active:
                description: |-
                  Active mirrors State == Acquired || State == Cancelling. Surfaced
                  as a top-level boolean for system-agent watchers that don't want to
                  parse the state enum.
                type: boolean
              activeSelectors:
                description: |-
                  ActiveSelectors enumerates the label selectors describing the node
                  set(s) involved in the holder ClusterPlan. A system-agent on a
                  node whose labels match any selector is expected to register and
                  pick up a NodePlan; agents on non-matching nodes stay idle.

                  When State is Free, ActiveSelectors is empty.
                items:
                  description: |-
                    A label selector is a label query over a set of resources. The result of matchLabels and
                    matchExpressions are ANDed. An empty label selector matches all objects. A null
                    label selector matches no objects.
                  properties:
                    matchExpressions:
                      description: matchExpressions is a list of label selector requirements.
                        The requirements are ANDed.
                      items:
                        description: |-
                          A label selector requirement is a selector that contains values, a key, and an operator that
                          relates the key and values.
                        properties:
                          key:
                            description: key is the label key that the selector applies
                              to.
                            type: string
                          operator:
                            description: |-
                              operator represents a key's relationship to a set of values.
                              Valid operators are In, NotIn, Exists and DoesNotExist.
                            type: string
                          values:
                            description: |-
                              values is an array of string values. If the operator is In or NotIn,
                              the values array must be non-empty. If the operator is Exists or DoesNotExist,
                              the values array must be empty. This array is replaced during a strategic
                              merge patch.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                        required:
                        - key
                        - operator
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                    matchLabels:
                      additionalProperties:
                        type: string
                      description: |-
                        matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                        map is equivalent to an element of matchExpressions, whose key field is "key", the
                        operator is "In", and the values array contains only "value". The requirements are ANDed.
                      type: object
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              cancellation:
                description: |-
                  Cancellation, when set, describes the in-progress pre-emption: the
                  Holder is being unwound to make way for the named preempting plan.
                properties:
                  preemptingOperation:
                    description: PreemptingOperation name (e.g. "etcd-snapshot-restore").
                    minLength: 1
                    type: string
                  preemptingPlan:
                    description: PreemptingPlan reference in the Beacon's namespace.
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  startedAt:
                    description: StartedAt is when the cancellation began.
                    format: date-time
                    type: string
                required:
                - preemptingOperation
                - preemptingPlan
                - startedAt
                type: object
              conditions:
                description: 'Conditions: Ready, Held, CancellationInProgress.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              holder:
                description: |-
                  Holder is the ClusterPlan currently holding the Beacon, when State
                  is Acquired or Cancelling.
                properties:
                  acquiredAt:
                    description: AcquiredAt is when the lock transitioned Free → Acquired.
                    format: date-time
                    type: string
                  cancellable:
                    description: |-
                      Cancellable mirrors Lifecycle.Cancellable so the beacon controller
                      can decide pre-emption without fetching the holder plan.
                    type: boolean
                  deadlineAt:
                    description: |-
                      DeadlineAt is the wall-clock deadline (AcquiredAt +
                      Lifecycle.TimeoutSeconds). After this point a periodic sweep
                      forcibly clears the holder and marks it Failed.
                    format: date-time
                    type: string
                  name:
                    description: Name of the holder ClusterPlan in the Beacon's namespace.
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  operation:
                    description: Operation name of the holder plan.
                    minLength: 1
                    type: string
                  uid:
                    description: UID of the holder ClusterPlan.
                    type: string
                required:
                - acquiredAt
                - deadlineAt
                - name
                - operation
                - uid
                type: object
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              registrationEndpoint:
                description: |-
                  RegistrationEndpoint is the absolute URL system-agents POST to in
                  order to receive their NodePlan name and a narrowly-scoped
                  kubeconfig. Populated by Rancher at startup; included on the
                  Beacon so agents need only know how to find their Beacon.
                type: string
              state:
                description: State is the high-level lock state.
                enum:
                - Free
                - Acquired
                - Cancelling
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
