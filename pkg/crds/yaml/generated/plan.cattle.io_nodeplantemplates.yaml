---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.1
  name: nodeplantemplates.plan.cattle.io
spec:
  group: plan.cattle.io
  names:
    kind: NodePlanTemplate
    listKind: NodePlanTemplateList
    plural: nodeplantemplates
    shortNames:
    - npt
    singular: nodeplantemplate
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NodePlanTemplate is a per-node template parameterised over the cluster
          type's "node source-of-truth" object chain.

          For CAPR clusters the chain is { CAPI Machine, RKEBootstrap }; for
          CAPRKE2 it is { CAPI Machine, RKE2Bootstrap }; for imported clusters it
          is { management.cattle.io/v3.Node }. Each clusterType's owners are
          declared in Spec.SourceOfTruths so the renderer knows which objects the
          template may walk via the `owner` template function.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NodePlanTemplateSpec is the desired state of a NodePlanTemplate.
            properties:
              sourceOfTruths:
                description: |-
                  SourceOfTruths declares which per-cluster-type "node SoT" objects
                  this template can be rendered against. The renderer picks the entry
                  whose ClusterType matches the parent cluster.
                items:
                  description: |-
                    NodeSourceOfTruth declares the per-cluster-type root object for per-node
                    rendering.
                  properties:
                    clusterType:
                      description: ClusterType is one of "capr", "caprke2", "imported".
                      enum:
                      - capr
                      - caprke2
                      - imported
                      type: string
                    owners:
                      description: |-
                        Owners is an ordered chain of object kinds the template may walk via
                        the `owner` template function. e.g. [{Machine}, {RKEBootstrap}] for
                        CAPR.
                      items:
                        description: |-
                          EntrypointRef declares the GVK of a cluster-side "source of truth" object
                          from which a template is rendered.
                        properties:
                          apiVersion:
                            description: APIVersion is the group/version, e.g. "rke.cattle.io/v1".
                            minLength: 1
                            type: string
                          kind:
                            description: Kind is the resource kind, e.g. "RKEControlPlane".
                            minLength: 1
                            type: string
                        required:
                        - apiVersion
                        - kind
                        type: object
                      type: array
                    primaryAPIVersion:
                      description: PrimaryAPIVersion of the root .Node object passed
                        to the template.
                      minLength: 1
                      type: string
                    primaryKind:
                      description: PrimaryKind of the root .Node object.
                      minLength: 1
                      type: string
                  required:
                  - clusterType
                  - primaryAPIVersion
                  - primaryKind
                  type: object
                minItems: 1
                type: array
              spec:
                description: |-
                  Spec is a Go text/template document that, when rendered, yields a
                  NodePlanSpec (Files/Instructions/Probes/Outputs). The renderer
                  strict-unmarshals the rendered output into NodePlanSpec and embeds
                  it into the materialised NodePlan (or into the calling
                  NodePoolPlan).
                type: string
            required:
            - sourceOfTruths
            type: object
          status:
            description: NodePlanTemplateStatus is the observed state of a NodePlanTemplate.
            properties:
              conditions:
                description: 'Conditions surface validation results: Ready (templates
                  parse).'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
